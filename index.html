
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft - Links</title>

<!-- Minecraft-style pixel font -->
<link href="https://fonts.cdnfonts.com/css/minecraft-4"
rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Minecraft', monospace;
    background:
      linear-gradient(#0005, #0008),
      url("https://i.redd.it/w7yf5r86rw5d1.gif")
      center/cover fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    image-rendering: pixelated;
}

/* Main menu container */
.menu {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

/* Minecraft title */
.title-card {
    background: #222;
    border: 4px solid #111;
    box-shadow:
      0 6px 0 #111,
      0 10px 25px #0009;
    padding: 28px 15px;
    margin-bottom: 35px;
    transform: perspective(500px) rotateX(2deg);
}

.title {
    color: #fff;
    font-size: clamp(40px, 9vw, 70px);
    letter-spacing: -5px;
    text-shadow:
      4px 4px 0 #444,
      6px 6px 0 #111;
}

.subtitle {
    color: #ddd;
    font-size: 18px;
    margin-top: 15px;
    letter-spacing: 2px;
}

/* Menu buttons */
.links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu-button {
    display: block;
    position: relative;
    padding: 17px 12px;
    background: #777;
    border: 3px solid #222;
    box-shadow:
      inset 3px 3px 0 #aaa,
      inset -3px -3px 0 #444,
      0 5px 0 #111;
    color: white;
    text-decoration: none;
    font-size: 24px;
    text-shadow: 2px 2px #333;
    transition: .12s ease;
}

.menu-button:hover {
    background: #999;
    transform: scale(1.035);
    filter: brightness(1.15);
}

.menu-button:active {
    transform: translateY(4px);
    box-shadow:
      inset 3px 3px 0 #aaa,
      inset -3px -3px 0 #444;
}

/* Button subtitles */
.button-description {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 18px;
    margin-top: 7px;
    color: #ddd;
}

/* Footer */
.footer {
    color: #ddd;
    font-size: 9px;
    margin-top: 35px;
    text-shadow: 2px 2px #000;
}

/* Mobile */
@media (max-width: 600px) {
    body {
        padding: 20px 15px;
        background-attachment: scroll;
    }

    .menu {
        max-width: 100%;
    }

    .title-card {
        padding: 22px 10px;
        margin-bottom: 28px;
    }

    .title {
        font-size: clamp(36px, 10vw, 50px);
    }

    .menu-button {
        padding: 16px 8px;
        font-size: 22px;
    }
}

/* Desktop */
@media (min-width: 1000px) {
    .menu {
        max-width: 550px;
    }

    .menu-button {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<main class="menu">

    <header class="title-card">
        <h1 class="title">K O Q O N A</h1>
        <p class="subtitle">WELCOME TO MY WORLD</p>
    </header>

    <nav class="links">

        <a href="https://www.instagram.com/nekoqona"
           class="menu-button">
            INSTAGRAM
            <span class="button-description">
                Follow my adventures
            </span>
        </a>

        <a href="https://www.twitch.tv/koqona"
           class="menu-button">
            TWITCH
            <span class="button-description">
                Watch my streams
            </span>
        </a>

        <a href="https://www.tiktok.com/@koqona"
           class="menu-button">
            TIKTOK
            <span class="button-description">
                Short clips and content
            </span>
        </a>

        <a href="https://discord.gg/xPKkbe58Y"
           class="menu-button">
            DISCORD
            <span class="button-description">
                Join the community
            </span>
        </a>

        <a href="https://x.com/koqona"
           class="menu-button">
            X/Twitter
            <span class="button-description">
                Explore more
            </span>
        </a>

        <a href="#"
           class="menu-button">
            ONLYPAWS
            <span class="button-description">
                Explore more
            </span>
        </a>

    </nav>

    <footer class="footer">
        © 2026 - THANKS FOR VISITING!
    </footer>

</main>

</body>
</html>
